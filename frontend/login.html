<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Smart Morning Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">
      <span>☀</span>
      <h1>Smart Morning Assistant</h1>
    </div>

    <h2>Sign In</h2>
    <p class="auth-sub">Welcome back! Enter your credentials to continue.</p>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com"
               required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••"
               required autocomplete="current-password" />
      </div>

      <p id="error-msg" class="auth-error" style="display:none"></p>

      <button type="submit" class="auth-btn" id="submit-btn">Sign In</button>
    </form>

    <p class="auth-footer">
      Don't have an account? <a href="/register.html">Create one</a>
    </p>

  </div>

  <script src="auth.js"></script>
</body>
</html>
